<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>kusa 선택곡</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1e40af;
  --primary-dark: #1e3a8a;
  --bg: #f1f5f9;
  --white: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --chord-bg: #fef3c7;
  --chord-text: #92400e;
  --genre-bg: #ede9fe;
  --genre-text: #5b21b6;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.view {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.view.hidden { display: none; }

/* ── 목록 화면 ── */
.list-header {
  background: var(--primary);
  padding: 14px 16px 12px;
  flex-shrink: 0;
}

.app-title {
  color: white;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.3px;
}

.search-wrap { position: relative; }

.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  opacity: 0.7;
}

.search-input {
  width: 100%;
  height: 40px;
  padding: 0 16px 0 38px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.2);
  color: white;
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;
}
.search-input::placeholder { color: rgba(255,255,255,0.65); }
.search-input::-webkit-search-cancel-button { filter: invert(1) opacity(0.6); }

.genre-scroll {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  white-space: nowrap;
  padding: 8px 12px;
  flex-shrink: 0;
}
.genre-scroll::-webkit-scrollbar { display: none; }

.genre-btn {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 14px;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  background: white;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin-right: 6px;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.genre-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.song-count {
  padding: 8px 16px 4px;
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  background: var(--bg);
}

.song-list-wrap {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
}

.song-item {
  display: flex;
  align-items: center;
  background: var(--white);
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  gap: 10px;
  -webkit-tap-highlight-color: transparent;
}
.song-item:active { background: #f8fafc; }

.song-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  min-width: 24px;
  text-align: right;
  flex-shrink: 0;
}

.song-info { flex: 1; min-width: 0; }

.song-title {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-first {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-badges {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
}
.badge-genre { background: var(--genre-bg); color: var(--genre-text); }
.badge-chord {
  background: var(--chord-bg);
  color: var(--chord-text);
  max-width: 72px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-arrow { color: #cbd5e1; font-size: 18px; flex-shrink: 0; }

.no-results {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 15px;
}

/* ── 가사 화면 ── */
#lyricsView { background: var(--white); }

.lyrics-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--primary);
  font-size: 15px;
  font-weight: 500;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px 0;
  -webkit-tap-highlight-color: transparent;
}

.nav-arrows {
  display: flex;
  gap: 4px;
}

.nav-arrow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: white;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s, color 0.1s;
}
.nav-arrow-btn:active { background: var(--bg); }
.nav-arrow-btn:disabled { opacity: 0.3; cursor: default; }

.lyrics-title-section {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.lyrics-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.lyrics-num {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  flex-shrink: 0;
}

.lyrics-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.lyrics-meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.lyrics-chord-full {
  font-size: 13px;
  background: var(--chord-bg);
  color: var(--chord-text);
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 600;
  font-family: ui-monospace, monospace;
}

.lyrics-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 16px 16px;
}

.lyrics-text {
  font-size: 16px;
  line-height: 1.9;
  white-space: pre-wrap;
  color: var(--text);
  word-break: keep-all;
}

.lyrics-empty {
  color: var(--text-muted);
  font-size: 15px;
  text-align: center;
  padding-top: 40px;
}

.lyrics-footer {
  flex-shrink: 0;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
  border-top: 1px solid var(--border);
  background: var(--white);
}

.footer-btns {
  display: flex;
  gap: 8px;
}

.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 56px;
  flex: 1;
  border: none;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: white;
  letter-spacing: 0.3px;
}
.action-btn:active { opacity: 0.82; }

.btn-sheet  { background: #2563eb; }
.btn-mr     { background: #059669; }
.btn-song   { background: #dc2626; }

.btn-icon { font-size: 20px; line-height: 1; }
</style>
</head>
<body>

<!-- 목록 화면 -->
<div id="listView" class="view">
  <div class="list-header">
    <div class="app-title">🎵 kusa 선택곡</div>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        class="search-input" id="searchInput" type="search"
        placeholder="노래 제목 검색..."
        autocomplete="off" autocorrect="off" spellcheck="false"
      >
    </div>
  </div>
  <div class="genre-scroll" id="genreScrollEl"></div>
  <div class="song-count" id="songCountEl"></div>
  <div class="song-list-wrap">
    <div id="songListEl"></div>
  </div>
</div>

<!-- 가사 화면 -->
<div id="lyricsView" class="view hidden">
  <div class="lyrics-nav">
    <button class="back-btn" onclick="showList()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      목록
    </button>
    <div class="nav-arrows">
      <button class="nav-arrow-btn" id="btnPrev" onclick="navSong(-1)" title="이전 곡">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <button class="nav-arrow-btn" id="btnNext" onclick="navSong(1)" title="다음 곡">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="lyrics-title-section">
    <div class="lyrics-title-row">
      <span class="lyrics-num" id="lyricsNumEl"></span>
      <span class="lyrics-title" id="lyricsTitleEl"></span>
    </div>
    <div class="lyrics-meta-row">
      <span class="badge badge-genre" id="lyricsGenreEl"></span>
      <span class="lyrics-chord-full" id="lyricsChordEl" style="display:none"></span>
    </div>
  </div>
  <div class="lyrics-body" id="lyricsBodyEl">
    <div class="lyrics-text" id="lyricsTextEl"></div>
  </div>
  <div class="lyrics-footer">
    <div class="footer-btns">
      <button class="action-btn btn-sheet" id="btnSheetEl">
        <span class="btn-icon">🎼</span>악보보기
      </button>
      <button class="action-btn btn-mr" id="btnMrEl">
        <span class="btn-icon">🎵</span>MR듣기
      </button>
      <button class="action-btn btn-song" id="btnSongEl">
        <span class="btn-icon">▶️</span>노래듣기
      </button>
    </div>
  </div>
</div>

<script>
let SONGS = [];
let GENRES = ['전체'];

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let i = 0;
  while (i < text.length) {
    const row = [];
    while (i < text.length) {
      let field = '';
      if (text[i] === '"') {
        i++;
        while (i < text.length) {
          if (text[i] === '"' && text[i+1] === '"') { field += '"'; i += 2; }
          else if (text[i] === '"') { i++; break; }
          else { field += text[i++]; }
        }
      } else {
        while (i < text.length && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') {
          field += text[i++];
        }
      }
      row.push(field);
      if (i < text.length && text[i] === ',') i++;
      else break;
    }
    if (i < text.length && text[i] === '\r') i++;
    if (i < text.length && text[i] === '\n') i++;
    if (row.length >= 2) rows.push(row);
  }
  return rows;
}

let currentGenre = '전체';
let currentIdx = 0;
let filteredIndices = [];

function getFiltered(genre, query) {
  const q = query.trim().toLowerCase();
  return SONGS.map((s, i) => i).filter(i => {
    const s = SONGS[i];
    if (genre !== '전체' && s.genre !== genre) return false;
    if (q && !s.title.toLowerCase().includes(q) && !s.first.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderGenres() {
  const el = document.getElementById('genreScrollEl');
  el.innerHTML = GENRES.map(g => `
    <button class="genre-btn${g === currentGenre ? ' active' : ''}" onclick="setGenre('${g}')">${g}</button>
  `).join('');
}

function renderList() {
  const query = document.getElementById('searchInput').value;
  filteredIndices = getFiltered(currentGenre, query);
  const el = document.getElementById('songListEl');
  const countEl = document.getElementById('songCountEl');
  countEl.textContent = `${filteredIndices.length}곡`;

  if (!filteredIndices.length) {
    el.innerHTML = '<div class="no-results">검색 결과가 없습니다</div>';
    return;
  }

  el.innerHTML = filteredIndices.map(i => {
    const s = SONGS[i];
    const num = i + 1;
    const chordFirst = s.chord ? s.chord.split(' ')[0] : '';
    return `<div class="song-item" onclick="showLyrics(${i})">
      <span class="song-num">${num}</span>
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-first">${s.first}</div>
      </div>
      <div class="song-badges">
        <span class="badge badge-genre">${s.genre}</span>
        ${chordFirst ? `<span class="badge badge-chord">${chordFirst}</span>` : ''}
      </div>
      <span class="item-arrow">›</span>
    </div>`;
  }).join('');
}

function setGenre(g) {
  currentGenre = g;
  renderGenres();
  renderList();
}

function showList() {
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('lyricsView').classList.add('hidden');
}

function showLyrics(idx) {
  currentIdx = idx;
  const s = SONGS[idx];

  document.getElementById('lyricsNumEl').textContent = (idx + 1) + '.';
  document.getElementById('lyricsTitleEl').textContent = s.title;
  document.getElementById('lyricsGenreEl').textContent = s.genre;

  const chordEl = document.getElementById('lyricsChordEl');
  if (s.chord) {
    chordEl.textContent = s.chord;
    chordEl.style.display = '';
  } else {
    chordEl.style.display = 'none';
  }

  const textEl = document.getElementById('lyricsTextEl');
  if (s.lyrics) {
    textEl.textContent = s.lyrics;
    textEl.className = 'lyrics-text';
  } else {
    textEl.textContent = '가사 준비중입니다.';
    textEl.className = 'lyrics-text lyrics-empty';
  }

  document.getElementById('lyricsBodyEl').scrollTop = 0;

  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === SONGS.length - 1;

  const q = encodeURIComponent(s.title);
  document.getElementById('btnSheetEl').onclick = () =>
    window.location.href = 'https://www.google.com/search?q=' + q + '+악보';
  document.getElementById('btnMrEl').onclick = () =>
    window.location.href = 'https://www.youtube.com/results?search_query=' + q + '+MR';
  document.getElementById('btnSongEl').onclick = () =>
    window.location.href = 'https://www.youtube.com/results?search_query=' + q;

  document.getElementById('listView').classList.add('hidden');
  document.getElementById('lyricsView').classList.remove('hidden');
}

function navSong(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < SONGS.length) showLyrics(next);
}

document.getElementById('searchInput').addEventListener('input', renderList);

async function init() {
  const res = await fetch('mysongs.csv');
  const text = await res.text();
  const rows = parseCSV(text);
  SONGS = rows.slice(1).map(r => ({
    genre: r[0] || '',
    title: r[1] || '',
    first: r[2] || '',
    chord: r[3] || '',
    lyrics: r[4] || ''
  }));
  GENRES = ['전체', ...new Set(SONGS.map(s => s.genre))];
  renderGenres();
  renderList();
}

init();
</script>
</body>
</html>
